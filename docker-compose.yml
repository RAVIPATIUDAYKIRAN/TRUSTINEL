services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - APP_NAME=TRUSTINEL
      - APP_VERSION=0.1.0
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/trustinel
      - REDIS_URL=redis://redis:6379/0
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
      - CORS_ORIGINS=["http://127.0.0.1:8000","http://localhost:8000","http://localhost:3000"]
      - CORS_ORIGIN_REGEX=^chrome-extension://.*$
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_POST_SCAN=10
      - RATE_LIMIT_GET_SCAN=60
      - RATE_LIMIT_AI_STATUS=30
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trustinel
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trustinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
