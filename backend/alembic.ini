# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# timezone = UTC

# max length of characters to use for "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow empty migrations to be generated
# write_empty = false

# repr() formatting inside templates
# repr_formatting = false

# version location specification; this defaults
# to alembic/versions.  When using multiple version
# directories, paths must be separated by ';'
# version_locations = %(here)s/alembic/versions

# version path separator; defaults to os.pathsep.
# Use a newline to make it easy to copy/paste on Windows
# version_path_separator = os.pathsep

# the database url
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/trustinel

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)-5.5s] %(name)s: %(message)s
datefmt = %H:%M:%S
