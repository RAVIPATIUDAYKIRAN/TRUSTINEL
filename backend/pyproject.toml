[project]
name = "trustinel"
version = "0.1.0"
description = "TRUSTINEL backend API foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.3",
    "sqlalchemy[asyncio]>=2.0.31",
    "asyncpg>=0.29.0",
    "redis>=5.0.7",
    "alembic>=1.13.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "black>=24.4.2",
    "isort>=5.13.2",
    "mypy>=1.10.0",
]
